services:
  api:
    build: ./api
    image: netsecure-api:lab
    ports:
      - "5000:5000"
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend

networks:
  frontend:
  backend: